version: 2
registries:
  maven-github:
    type: maven-repository
    url: https://github-package-registry-mirror.gc.nav.no/cached/maven-release

updates:
  - package-ecosystem: "gradle"
    directory: "/"
    registries:
      - maven-github
    schedule:
      interval: "daily"
      time: "03:00"
      timezone: "Europe/Oslo"
    commit-message:
      prefix: "build(deps): "
    cooldown:
      default-days: 7
      exclude:
        - "no.nav*"
    open-pull-requests-limit: 15
    groups:
      major-updates:
        update-types:
          - "major"
      nav-dependencies:
        patterns:
          - "no.nav*"
      other-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
      time: "03:00"
      timezone: "Europe/Oslo"
    commit-message:
      prefix: "ci(deps): "
    cooldown:
      default-days: 7
    open-pull-requests-limit: 15
