version: 2
registries:
  maven-github:
    type: maven-repository
    url: https://github-package-registry-mirror.gc.nav.no/cached/maven-release

updates:
  - package-ecosystem: "gradle"
    directory: "/"
    registries:
      - maven-github
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
      exclude:
        - "no.nav*"
    open-pull-requests-limit: 15
    groups:
      nav-dependencies:
        patterns:
          - "no.nav*"
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 15

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 15
