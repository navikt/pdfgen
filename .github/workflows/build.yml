name: Build main
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '**.MD'
      - '.gitignore'
      - 'LICENCE'
      - 'CODEOWNERS'

permissions:
  contents: read

jobs:
  build:
    name: Checkout code and run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up Java 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: 'temurin'
          java-version: '25'
          architecture: x64
          cache: 'gradle'
      - name: Build gradle artifacts
        shell: bash
        run: |
          ./gradlew installDist
      - name: Run checks
        run: |
          ./gradlew check
