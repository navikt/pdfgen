name: Publish main
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write
  packages: write
env:
  IMAGE: ghcr.io/${{ github.repository }}
  NEW_VERSION: ${{ github.event.release.tag_name }}

jobs:
  build:
    name: Build and publish docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: 'temurin'
          java-version: '25'
          architecture: x64

      - name: Run checks and build Gradle artifacts
        shell: bash
        run: |
          ./gradlew check installDist

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Konsumenter bygger for amd64 og arm64; Dockerfile har ingen RUN-steg, så QEMU trengs ikke
      - name: Build and push multi-platform docker image to ghcr.io
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag "${IMAGE}:${NEW_VERSION}" \
            --push .
