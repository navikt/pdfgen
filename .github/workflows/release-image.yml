name: Publish main
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Release tag to build and publish (for example 2.0.126)
        required: true
        type: string

permissions:
  contents: read
  packages: write
  id-token: write
env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build and publish docker image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate release tag
        id: validate_release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.version || github.event.release.tag_name }}
        run: |
          is_draft=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.draft')
          if [[ "$is_draft" != "false" ]]; then
            echo "::error::Tag is not a published GitHub release"
            exit 1
          fi

          printf 'tag=%s\n' "$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          latest_tag=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')
          if [[ "$RELEASE_TAG" == "$latest_tag" ]]; then
            printf 'is_latest=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'is_latest=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.validate_release.outputs.tag }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: 'temurin'
          java-version: '25'
          architecture: x64

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Run checks and build app distribution
        shell: bash
        run: |
          ./gradlew -PskipDockerImageTests=true check installDist

      - name: Authenticate to Nais Artifact Registry
        uses: nais/login@40b72a35a18ddf2ad74b632461139ab838cc2a2f # v0
        with:
          team: amt

      - name: Login to ghcr.io
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Konsumenter bygger for amd64 og arm64; Dockerfile har ingen RUN-steg, så QEMU trengs ikke
      - name: Build and push multi-platform docker image to ghcr.io
        env:
          RELEASE_TAG: ${{ steps.validate_release.outputs.tag }}
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --provenance=false \
            --tag "${IMAGE}:${RELEASE_TAG}" \
            --push .

      - name: Tag image as latest
        if: steps.validate_release.outputs.is_latest == 'true'
        env:
          RELEASE_TAG: ${{ steps.validate_release.outputs.tag }}
        run: docker buildx imagetools create --tag "${IMAGE}:latest" "${IMAGE}:${RELEASE_TAG}"
