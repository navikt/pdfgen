name: Publish main
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write
  packages: write
env:
  IMAGE: ghcr.io/${{ github.repository }}
  NEW_VERSION: ${{ github.event.release.tag_name }}

jobs:
  build:
    name: Build and publish docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          architecture: x64
          cache: 'gradle'
      - name: Build gradle artifacts
        shell: bash
        run: |
          ./gradlew installDist
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Login to ghcr.io
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Konsumenter bygger for amd64 og arm64; Dockerfile har ingen RUN-steg, så QEMU trengs ikke
      - name: Build and push multi-platform docker image to ghcr.io
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --tag ${{ env.IMAGE }}:${{ env.NEW_VERSION }} \
            --push .
